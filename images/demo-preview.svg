<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" width="100%" height="auto">
  <defs>
    <linearGradient id="demoBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e0a12"/>
      <stop offset="100%" stop-color="#060205"/>
    </linearGradient>
    <filter id="demoGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="900" height="480" rx="12" fill="url(#demoBg)" stroke="#2f2f3d" stroke-width="2"/>

  <!-- Simulated Window Bar -->
  <path d="M 0,12 C 0,5.4 5.4,0 12,0 L 888,0 C 894.6,0 900,5.4 900,12 L 900,42 L 0,42 Z" fill="#14141c"/>
  <circle cx="24" cy="21" r="6" fill="#ff5f56"/>
  <circle cx="44" cy="21" r="6" fill="#ffbd2e"/>
  <circle cx="64" cy="21" r="6" fill="#27c93f"/>
  <text x="450" y="26" fill="#7d7d8c" font-family="ui-monospace, monospace" font-size="12" text-anchor="middle">Arachnopedia — Procedural Spider Walkthrough Demo</text>

  <!-- Simulated Text Lines -->
  <g transform="translate(60, 80)" opacity="0.35" fill="#d7d7dc">
    <rect x="0" y="0" width="380" height="18" rx="3"/>
    <rect x="0" y="32" width="760" height="10" rx="2"/>
    <rect x="0" y="52" width="720" height="10" rx="2"/>
    <rect x="0" y="72" width="740" height="10" rx="2"/>
    <rect x="0" y="92" width="680" height="10" rx="2"/>
    
    <rect x="0" y="130" width="750" height="10" rx="2"/>
    <rect x="0" y="150" width="700" height="10" rx="2"/>
    <rect x="0" y="170" width="730" height="10" rx="2"/>
    <rect x="0" y="190" width="650" height="10" rx="2"/>

    <rect x="0" y="230" width="710" height="10" rx="2"/>
    <rect x="0" y="250" width="760" height="10" rx="2"/>
    <rect x="0" y="270" width="620" height="10" rx="2"/>
  </g>

  <!-- Glitch & Anchored Words -->
  <g transform="translate(60, 80)">
    <!-- Word Held -->
    <rect x="220" y="28" width="95" height="18" rx="2" fill="none" stroke="#8dff3c" stroke-width="1.5"/>
    <text x="225" y="42" fill="#8dff3c" font-family="ui-monospace, monospace" font-size="11">arachnids</text>

    <!-- Word Glitched -->
    <rect x="410" y="68" width="95" height="18" rx="2" fill="#ff3df0" opacity="0.2"/>
    <rect x="410" y="68" width="95" height="18" rx="2" fill="none" stroke="#ff3df0" stroke-width="1.5"/>
    <text x="415" y="82" fill="#2fe6ff" font-family="ui-monospace, monospace" font-size="11">D3C0D1NG...</text>

    <!-- Stretched Silk Thread -->
    <path d="M 260,40 Q 380,120 480,210" stroke="#f0f0f4" stroke-width="1.5" fill="none" opacity="0.85"/>
  </g>

  <!-- Spider Center -->
  <g transform="translate(480, 260) scale(1.3)" filter="url(#demoGlow)">
    <!-- Legs -->
    <g fill="none" stroke="#ff3b2f" stroke-width="2.5" stroke-linecap="round">
      <polyline points="15,-10 38,-38 66,-50 90,-40"/>
      <polyline points="6,-14 22,-48 46,-68 65,-75"/>
      <polyline points="-6,-14 -24,-48 -46,-68 -70,-80"/>
      <polyline points="-14,-10 -40,-34 -68,-42 -95,-35"/>
      
      <polyline points="15,10 38,38 66,50 85,65"/>
      <polyline points="6,14 22,48 46,68 60,82"/>
      <polyline points="-6,14 -24,48 -46,68 -65,78"/>
      <polyline points="-14,10 -40,34 -68,42 -88,50"/>
    </g>
    <!-- Glowing Joints -->
    <g fill="#8dff3c">
      <circle cx="38" cy="-38" r="3.5"/><circle cx="66" cy="-50" r="3"/><circle cx="90" cy="-40" r="4"/>
      <circle cx="22" cy="-48" r="3.5"/><circle cx="46" cy="-68" r="3"/><circle cx="65" cy="-75" r="4"/>
      <circle cx="-24" cy="-48" r="3.5"/><circle cx="-46" cy="-68" r="3"/><circle cx="-70" cy="-80" r="4"/>
      <circle cx="-40" cy="-34" r="3.5"/><circle cx="-68" cy="-42" r="3"/><circle cx="-95" cy="-35" r="4"/>
      <circle cx="38" cy="38" r="3.5"/><circle cx="66" cy="50" r="3"/><circle cx="85" cy="65" r="4"/>
      <circle cx="22" cy="48" r="3.5"/><circle cx="46" cy="68" r="3"/><circle cx="60" cy="82" r="4"/>
      <circle cx="-24" cy="48" r="3.5"/><circle cx="-46" cy="68" r="3"/><circle cx="-65" cy="78" r="4"/>
      <circle cx="-40" cy="34" r="3.5"/><circle cx="-68" cy="42" r="3"/><circle cx="-88" cy="50" r="4"/>
    </g>
    <!-- Body -->
    <ellipse cx="-20" cy="0" rx="26" ry="19" fill="#14050a" stroke="#ff3b2f" stroke-width="2"/>
    <ellipse cx="14" cy="0" rx="16" ry="12" fill="#14050a" stroke="#ff3b2f" stroke-width="2"/>
    <polygon points="-8,-5 -8,5 0,0" fill="#ff3030"/>
    <polygon points="8,-5 8,5 0,0" fill="#ff3030"/>
    <circle cx="23" cy="-3" r="2" fill="#8dff3c"/>
    <circle cx="23" cy="3" r="2" fill="#8dff3c"/>
  </g>

  <!-- User media placeholder callout -->
  <g transform="translate(450, 410)">
    <rect x="-240" y="-22" width="480" height="40" rx="20" fill="rgba(20,20,30,0.85)" stroke="#3f3f52" stroke-width="1.5"/>
    <circle cx="-210" cy="-2" r="7" fill="#ff3b2f"/>
    <polygon points="-212,-6 -212,2 -206,-2" fill="#ffffff"/>
    <text x="-190" y="3" fill="#eaeaf0" font-family="'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="bold">
      DROP YOUR DEMO GIF / VIDEO HERE: <tspan fill="#2fe6ff">images/demo.gif</tspan>
    </text>
  </g>
</svg>

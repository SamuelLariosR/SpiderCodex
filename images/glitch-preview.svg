<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" width="100%" height="auto">
  <defs>
    <filter id="chromaAberration" x="-20%" y="-20%" width="140%" height="140%">
      <feOffset in="SourceGraphic" dx="-2" dy="0" result="redOffset"/>
      <feOffset in="SourceGraphic" dx="2" dy="0" result="blueOffset"/>
    </filter>
  </defs>

  <rect width="800" height="360" rx="10" fill="#0b0b10" stroke="#252535" stroke-width="2"/>

  <text x="400" y="38" fill="#ffffff" font-family="'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle">
    TYPOGRAPHIC GLITCH SYSTEM &amp; PERSISTENT MARKS
  </text>
  <text x="400" y="60" fill="#7d7d88" font-family="ui-monospace, monospace" font-size="11" text-anchor="middle">
    Procedural DOM alteration triggered whenever spider legs anchor to words
  </text>

  <!-- Samples -->
  <g transform="translate(60, 95)">
    <!-- 1. Transient Scramble -->
    <rect x="0" y="0" width="320" height="95" rx="6" fill="#14141e" stroke="#2fe6ff" stroke-width="1.2"/>
    <text x="16" y="24" fill="#2fe6ff" font-family="ui-monospace, monospace" font-size="11" font-weight="bold">1. GLITCH SCRAMBLE (TRANSIENT)</text>
    <text x="16" y="58" fill="#2fe6ff" font-family="ui-monospace, monospace" font-size="18" font-weight="bold" letter-spacing="1">
      !&lt;&gt;-_/[#%&amp;$01ΔΞ
    </text>
    <text x="16" y="80" fill="#a3a3ad" font-family="'Helvetica Neue', Arial, sans-serif" font-size="11">Glyph shuffling in 6 frames @ 38ms</text>

    <!-- 2. Neon Box (mk-box) -->
    <rect x="360" y="0" width="320" height="95" rx="6" fill="#14141e" stroke="#ff3df0" stroke-width="1.2"/>
    <text x="16" y="24" transform="translate(360,0)" fill="#ff3df0" font-family="ui-monospace, monospace" font-size="11" font-weight="bold">2. NEON HIGHLIGHT BOX (.mk-box)</text>
    <g transform="translate(376, 42)">
      <rect x="0" y="0" width="130" height="26" rx="3" fill="rgba(255, 61, 240, 0.16)" stroke="#ff3df0"/>
      <text x="65" y="18" fill="#ffffff" font-family="'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle">cephalothorax</text>
    </g>
    <text x="16" y="80" transform="translate(360,0)" fill="#a3a3ad" font-family="'Helvetica Neue', Arial, sans-serif" font-size="11">Box-shadow with neon backlight</text>

    <!-- 3. Rotation & Skew (.mk-rot) -->
    <rect x="0" y="120" width="320" height="95" rx="6" fill="#14141e" stroke="#ffcc33" stroke-width="1.2"/>
    <text x="16" y="144" fill="#ffcc33" font-family="ui-monospace, monospace" font-size="11" font-weight="bold">3. ANGULAR SKEW &amp; TILT (.mk-rot)</text>
    <g transform="translate(20, 162)">
      <rect x="0" y="0" width="130" height="26" rx="2" fill="#0a0a0d" stroke="#ffcc33" transform="rotate(-12, 65, 13)"/>
      <text x="65" y="18" fill="#ffcc33" font-family="'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" transform="rotate(-12, 65, 13)">chelicerae</text>
    </g>
    <text x="16" y="200" fill="#a3a3ad" font-family="'Helvetica Neue', Arial, sans-serif" font-size="11">Angular displacement from ±8° to ±32°</text>

    <!-- 4. Retro Monospace (.mk-mono) -->
    <rect x="360" y="120" width="320" height="95" rx="6" fill="#14141e" stroke="#ff3030" stroke-width="1.2"/>
    <text x="16" y="144" transform="translate(360,0)" fill="#ff3030" font-family="ui-monospace, monospace" font-size="11" font-weight="bold">4. RETRO MONOSPACE RED (.mk-mono)</text>
    <g transform="translate(376, 162)">
      <text x="0" y="18" fill="#ff3030" font-family="'Courier New', Courier, monospace" font-size="17" font-weight="bold" letter-spacing="2">
        &gt;&gt; BIO_VENOM &lt;&lt;
      </text>
    </g>
    <text x="16" y="200" transform="translate(360,0)" fill="#a3a3ad" font-family="'Helvetica Neue', Arial, sans-serif" font-size="11">Fixed-width courier retro substitution</text>
  </g>
</svg>

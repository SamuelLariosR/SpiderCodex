<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="auto">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070204"/>
      <stop offset="40%" stop-color="#0e0a12"/>
      <stop offset="100%" stop-color="#0a0a0d"/>
    </linearGradient>
    <linearGradient id="spiderGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff3b2f"/>
      <stop offset="50%" stop-color="#ff3df0"/>
      <stop offset="100%" stop-color="#2fe6ff"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Dark Cybernetic Background -->
  <rect width="1200" height="420" fill="url(#bgGrad)"/>
  <rect width="1200" height="420" fill="none" stroke="#25252d" stroke-width="2"/>

  <!-- Subtle Background Grid -->
  <g opacity="0.12" stroke="#4d6bff" stroke-width="1">
    <line x1="0" y1="70" x2="1200" y2="70"/>
    <line x1="0" y1="140" x2="1200" y2="140"/>
    <line x1="0" y1="210" x2="1200" y2="210"/>
    <line x1="0" y1="280" x2="1200" y2="280"/>
    <line x1="0" y1="350" x2="1200" y2="350"/>
    <line x1="200" y1="0" x2="200" y2="420"/>
    <line x1="400" y1="0" x2="400" y2="420"/>
    <line x1="600" y1="0" x2="600" y2="420"/>
    <line x1="800" y1="0" x2="800" y2="420"/>
    <line x1="1000" y1="0" x2="1000" y2="420"/>
  </g>

  <!-- Procedural Silk Threads -->
  <g stroke="rgba(240,240,250,0.22)" stroke-width="1.2" fill="none">
    <path d="M 0,220 Q 280,260 520,180 T 1200,230"/>
    <path d="M 120,0 Q 420,190 780,110 T 1200,160"/>
    <path d="M 50,420 Q 380,210 820,310 T 1200,340"/>
  </g>

  <!-- Glowing Spider Silhouette with IK Legs -->
  <g transform="translate(930, 210) scale(1.65)" filter="url(#glow)">
    <!-- Legs -->
    <g fill="none" stroke="#ff3b2f" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="15,-10 38,-38 66,-50 82,-66"/>
      <polyline points="6,-14 22,-48 46,-68 56,-82"/>
      <polyline points="-6,-14 -24,-48 -46,-68 -56,-80"/>
      <polyline points="-14,-10 -40,-34 -68,-42 -84,-52"/>
      
      <polyline points="15,10 38,38 66,50 82,66"/>
      <polyline points="6,14 22,48 46,68 56,82"/>
      <polyline points="-6,14 -24,48 -46,68 -56,80"/>
      <polyline points="-14,10 -40,34 -68,42 -84,52"/>
    </g>
    <!-- Glowing Joints -->
    <g fill="#8dff3c">
      <circle cx="38" cy="-38" r="3.2"/><circle cx="66" cy="-50" r="2.6"/><circle cx="82" cy="-66" r="3.6"/>
      <circle cx="22" cy="-48" r="3.2"/><circle cx="46" cy="-68" r="2.6"/><circle cx="56" cy="-82" r="3.6"/>
      <circle cx="-24" cy="-48" r="3.2"/><circle cx="-46" cy="-68" r="2.6"/><circle cx="-56" cy="-80" r="3.6"/>
      <circle cx="-40" cy="-34" r="3.2"/><circle cx="-68" cy="-42" r="2.6"/><circle cx="-84" cy="-52" r="3.6"/>
      <circle cx="38" cy="38" r="3.2"/><circle cx="66" cy="50" r="2.6"/><circle cx="82" cy="66" r="3.6"/>
      <circle cx="22" cy="48" r="3.2"/><circle cx="46" cy="68" r="2.6"/><circle cx="56" cy="82" r="3.6"/>
      <circle cx="-24" cy="48" r="3.2"/><circle cx="-46" cy="68" r="2.6"/><circle cx="-56" cy="80" r="3.6"/>
      <circle cx="-40" cy="34" r="3.2"/><circle cx="-68" cy="42" r="2.6"/><circle cx="-84" cy="52" r="3.6"/>
    </g>
    <!-- Abdomen & Prosoma -->
    <ellipse cx="-20" cy="0" rx="26" ry="19" fill="#14050a" stroke="#ff3b2f" stroke-width="2"/>
    <polygon points="-8,-5 -8,5 0,0" fill="#ff3030"/>
    <polygon points="8,-5 8,5 0,0" fill="#ff3030"/>
    <ellipse cx="14" cy="0" rx="16" ry="12" fill="#14050a" stroke="#ff3b2f" stroke-width="2"/>
    <circle cx="23" cy="-3" r="2" fill="#8dff3c"/>
    <circle cx="23" cy="3" r="2" fill="#8dff3c"/>
  </g>

  <!-- Typography & Badges -->
  <g transform="translate(80, 110)">
    <!-- Badge Version -->
    <rect x="0" y="0" width="180" height="28" rx="14" fill="#181822" stroke="#2a2a38" stroke-width="1.2"/>
    <circle cx="16" cy="14" r="4.5" fill="#8dff3c" filter="url(#glow)"/>
    <text x="32" y="19" fill="#8dff3c" font-family="ui-monospace, monospace" font-size="12" font-weight="bold" letter-spacing="1.5">ARANEAE.PROC v1.0</text>

    <!-- Main Title -->
    <text x="0" y="85" fill="#ffffff" font-family="'Helvetica Neue', Arial, sans-serif" font-size="54" font-weight="900" letter-spacing="-1">
      ARACHNOPEDIA
    </text>
    <text x="0" y="125" fill="url(#spiderGlow)" font-family="Georgia, serif" font-style="italic" font-size="26">
      Procedural Spider · 3D Inverse Kinematics · Verlet Physics
    </text>

    <!-- Subtitle / Description -->
    <text x="0" y="172" fill="#a3a3ad" font-family="'Helvetica Neue', Arial, sans-serif" font-size="16">
      <tspan x="0" dy="0">Real-time biological simulation of arthropod locomotion over live DOM text,</tspan>
      <tspan x="0" dy="24">featuring spatial hashing, cyberpunk glitch typography, and elastic Verlet silk.</tspan>
    </text>

    <!-- Tech Tags -->
    <g transform="translate(0, 225)">
      <rect x="0" y="0" width="145" height="26" rx="4" fill="#15151e" stroke="#ff3b2f"/>
      <text x="72" y="17" fill="#ff3b2f" font-family="ui-monospace, monospace" font-size="11" text-anchor="middle">INVERSE KINEMATICS</text>

      <rect x="157" y="0" width="130" height="26" rx="4" fill="#15151e" stroke="#2fe6ff"/>
      <text x="222" y="17" fill="#2fe6ff" font-family="ui-monospace, monospace" font-size="11" text-anchor="middle">VERLET PHYSICS</text>

      <rect x="299" y="0" width="125" height="26" rx="4" fill="#15151e" stroke="#8dff3c"/>
      <text x="361" y="17" fill="#8dff3c" font-family="ui-monospace, monospace" font-size="11" text-anchor="middle">CANVAS 2D 60FPS</text>

      <rect x="436" y="0" width="130" height="26" rx="4" fill="#15151e" stroke="#ff3df0"/>
      <text x="501" y="17" fill="#ff3df0" font-family="ui-monospace, monospace" font-size="11" text-anchor="middle">ES6 ARCHITECTURE</text>
    </g>
  </g>
</svg>
